name: Build and Push hermes-hassio

on:
  push:
    branches:
      - main
    paths:
      - "hermes-agent/**"
      - ".github/workflows/build-hassio.yaml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ensure workflow tag matches add-on version
        run: |
          CFG_VER=$(grep -oP '(?<=^version: ")[^"]+' hermes-agent/config.yaml)
          TAG_VER=$(grep -oP '(?<=devinslick/hermes-hassio:)[0-9.]+' .github/workflows/build-hassio.yaml | head -1)
          echo "config=$CFG_VER workflow=$TAG_VER"
          [ "$CFG_VER" = "$TAG_VER" ] || { echo "::error::version mismatch — bump BOTH hermes-agent/config.yaml and the workflow tag"; exit 1; }
          LABEL_VER=$(grep -oP '(?<=io.hass.version=")[^"]+' hermes-agent/Dockerfile)
          [ "$CFG_VER" = "$LABEL_VER" ] || { echo "::error::Dockerfile io.hass.version label mismatch"; exit 1; }

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push hermes-hassio
        uses: docker/build-push-action@v5
        with:
          context: hermes-agent
          push: true
          tags: |
            devinslick/hermes-hassio:1.0.0
            devinslick/hermes-hassio:latest
